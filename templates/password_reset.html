{% extends 'base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-family: Arial, sans-serif;">
    <h2 style="margin-top: 0; color: #2c3e50;">Відновлення пароля</h2>
    <p style="color: #7f8c8d; font-size: 14px; line-height: 1.5;">Вкажіть свій Email, і ми надішлемо туди інструкцію для зміни пароля.</p>
    <form method="POST" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px; background: #e67e22; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Скинути пароль</button>
    </form>
</div>
{% endblock %}
